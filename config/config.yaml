server:
  port: 8080
  host: 0.0.0.0

# rate_limit 控制全局 HTTP 请求限速。
# requests_per_minute 表示每分钟最多允许通过的请求数；小于等于 0 表示关闭限速。
rate_limit:
  requests_per_minute: 60

# session 控制浏览器会话 Cookie 的签名/加密参数。
# salt 用于 gin session cookie store，请在生产环境替换为足够长的随机字符串。
session:
  salt: novels-ai-session-salt

# log 控制应用日志输出。
# output:
#   console/stdout 表示输出到控制台；
#   file 表示写入 file.path 指定的日志文件。
# level 支持 debug、info、warn、error，低于该级别的日志不会输出。
log:
  output: console
  level: info
  # file 仅在 output: file 时生效。
  # max_size_mb 表示单个日志文件最大体积，达到阈值后轮转。
  # max_backups 表示最多保留多少个历史备份文件。
  file:
    path: logs/novels_ai.log
    max_size_mb: 100
    max_backups: 5

system:
  postgres:
    host: localhost
    port: 5432
    user: postgres
    password: postgres
    dbname: novels_ai
