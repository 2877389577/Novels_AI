server:
  port: 8080
  host: 0.0.0.0

# rate_limit 控制全局 HTTP 请求限速。
# requests_per_minute 表示每分钟最多允许通过的请求数；小于等于 0 表示关闭限速。
rate_limit:
  requests_per_minute: 60

# session 控制浏览器会话 Cookie 的签名/加密参数。
# salt 用于 gin session cookie store，请在生产环境替换为足够长的随机字符串。
session:
  salt: novels-ai-session-salt

# ai_provider 控制 ai 提供商管理模块。
ai_provider:
  crypto:
    # secret 和 salt 用于派生 API Key 加密密钥，生产环境请替换为随机长字符串。
    secret: novels-ai-provider-secret
    salt: novels-ai-provider-salt

# upload 控制文件上传到 S3 兼容对象存储。
upload:
  s3:
    # endpoint 是对象存储 API 地址；MinIO 示例：http://localhost:9000
    endpoint: http://localhost:9000
    # region 是签名区域；S3 兼容服务通常可以使用 us-east-1。
    region: us-east-1
    # bucket 是上传目标桶，请提前创建并配置公开读取策略。
    bucket: novels-ai
    # 生产环境请替换为真实访问密钥，避免使用示例值。
    access_key_id: your-access-key-id
    secret_access_key: your-secret-access-key
    # public_base_url 是前端可访问的公开地址前缀，通常是 CDN 或桶公开访问地址。
    public_base_url: http://localhost:9000/novels-ai
    # MinIO 等 S3 兼容服务通常需要 path-style。
    use_path_style: true
    # prefix 用于把上传文件放到固定目录下。
    prefix: uploads

# log 控制应用日志输出。
# output:
#   console/stdout 表示输出到控制台；
#   file 表示写入 file.path 指定的日志文件。
# level 支持 debug、info、warn、error，低于该级别的日志不会输出。
log:
  output: console
  level: info
  # file 仅在 output: file 时生效。
  # max_size_mb 表示单个日志文件最大体积，达到阈值后轮转。
  # max_backups 表示最多保留多少个历史备份文件。
  file:
    path: logs/novels_ai.log
    max_size_mb: 100
    max_backups: 5

system:
  postgres:
    host: localhost
    port: 5432
    user: postgres
    password: postgres
    dbname: novels_ai
