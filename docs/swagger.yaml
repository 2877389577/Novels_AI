basePath: /api/v1
definitions:
  aiprovider.aiProviderListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/aiprovider.aiProviderResponse'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  aiprovider.aiProviderResponse:
    properties:
      apiKey:
        description: API Key 明文，仅详情类响应返回
        type: string
      baseUrl:
        description: AI 提供商基础 URL
        type: string
      configJson:
        description: AI 提供商额外配置
        type: object
      createdAt:
        description: 创建时间
        type: string
      id:
        description: AI 提供商 ID
        type: integer
      isEnabled:
        description: 是否启用
        type: boolean
      name:
        description: AI 提供商名称
        type: string
      priority:
        description: 优先级
        type: integer
      providerType:
        description: AI 提供商类型
        type: string
      updatedAt:
        description: 更新时间
        type: string
    type: object
  aiprovider.createAIProviderRequest:
    properties:
      apiKey:
        description: API Key 明文，必填，入库前会加密
        type: string
      baseUrl:
        description: AI 提供商基础 URL，必填
        type: string
      configJson:
        description: AI 提供商额外配置
        type: object
      isEnabled:
        description: 是否启用；不传时默认 true
        type: boolean
      name:
        description: AI 提供商名称，必填
        type: string
      priority:
        description: 优先级；不传时默认 100
        type: integer
      providerType:
        description: AI 提供商类型，必填
        type: string
    required:
    - apiKey
    - baseUrl
    - name
    - providerType
    type: object
  aiprovider.updateAIProviderRequest:
    properties:
      apiKey:
        description: API Key 明文；传入时重新加密，不传则保留原值
        type: string
      baseUrl:
        description: AI 提供商基础 URL
        type: string
      configJson:
        description: AI 提供商额外配置
        type: object
      isEnabled:
        description: 是否启用
        type: boolean
      name:
        description: AI 提供商名称
        type: string
      priority:
        description: 优先级
        type: integer
      providerType:
        description: AI 提供商类型
        type: string
    type: object
  common.Response:
    properties:
      code:
        description: 状态码
        type: integer
      data:
        description: 数据
      msg:
        description: 状态描述
        type: string
    type: object
  common.SystemError:
    properties:
      code:
        description: Code 是业务错误码，统一写入响应体，方便前端按业务场景处理。
        type: integer
      msg:
        description: Msg 是展示给调用方的错误提示，保持和业务错误定义在同一处维护。
        type: string
    type: object
  login.passwordRequest:
    properties:
      password:
        type: string
    type: object
  novel.chapterListItemResponse:
    properties:
      chapterNo:
        description: 章节编号
        type: integer
      createdAt:
        description: 创建时间
        type: string
      id:
        description: 章节 ID
        type: integer
      novelId:
        description: 小说 ID
        type: integer
      title:
        description: 章节标题
        type: string
      updatedAt:
        description: 更新时间
        type: string
      wordCount:
        description: 章节字数
        type: integer
    type: object
  novel.chapterListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/novel.chapterListItemResponse'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  novel.chapterResponse:
    properties:
      chapterNo:
        description: 章节编号
        type: integer
      content:
        description: 章节内容
        type: string
      createdAt:
        description: 创建时间
        type: string
      id:
        description: 章节 ID
        type: integer
      novelId:
        description: 小说 ID
        type: integer
      title:
        description: 章节标题
        type: string
      updatedAt:
        description: 更新时间
        type: string
      wordCount:
        description: 章节字数
        type: integer
    type: object
  novel.characterListItemResponse:
    properties:
      appearanceImgUrl:
        description: 角色形象图 URL
        type: string
      charactersTags:
        description: 角色标签
        items:
          type: string
        type: array
      gender:
        description: 角色性别
        type: string
      id:
        description: 角色 ID
        type: integer
      name:
        description: 角色名称
        type: string
      status:
        description: 角色状态：1 在线，2 下线
        type: integer
    type: object
  novel.characterListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/novel.characterListItemResponse'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  novel.characterResponse:
    properties:
      ability:
        description: 角色能力
        type: string
      appearance:
        description: 角色外貌
        type: string
      appearanceImgUrl:
        description: 角色形象图 URL
        type: string
      background:
        description: 角色背景
        type: string
      charactersTags:
        description: 角色标签
        items:
          type: string
        type: array
      createdAt:
        description: 创建时间
        type: string
      firstAppearanceChapterId:
        description: 首次出现章节 ID
        type: integer
      gender:
        description: 角色性别
        type: string
      id:
        description: 角色 ID
        type: integer
      intro:
        description: 角色介绍
        type: string
      motivation:
        description: 角色动机
        type: string
      name:
        description: 角色名称
        type: string
      novelId:
        description: 小说 ID
        type: integer
      personality:
        description: 角色性格
        type: string
      plotDirection:
        description: 角色剧情方向
        type: string
      status:
        description: 角色状态：1 在线，2 下线
        type: integer
      updatedAt:
        description: 更新时间
        type: string
    type: object
  novel.createChapterRequest:
    properties:
      chapterNo:
        description: 章节编号，必填且大于 0
        type: integer
      content:
        description: 章节内容，必填
        type: string
      title:
        description: 章节标题，必填
        type: string
      wordCount:
        description: 章节字数，必填；用指针是为了允许前端传 0
        type: integer
    required:
    - chapterNo
    - content
    - title
    - wordCount
    type: object
  novel.createCharacterRequest:
    properties:
      ability:
        description: 角色能力
        type: string
      appearance:
        description: 角色外貌
        type: string
      appearanceImgUrl:
        description: 角色形象图 URL
        type: string
      background:
        description: 角色背景
        type: string
      charactersTags:
        description: 角色标签
        items:
          type: string
        type: array
      firstAppearanceChapterId:
        description: 首次出现章节 ID
        type: integer
      gender:
        description: 角色性别
        type: string
      intro:
        description: 角色介绍
        type: string
      motivation:
        description: 角色动机
        type: string
      name:
        description: 角色名称，必填
        type: string
      personality:
        description: 角色性格
        type: string
      plotDirection:
        description: 角色剧情方向
        type: string
      status:
        description: 角色状态：1 在线，2 下线
        type: integer
    required:
    - name
    type: object
  novel.createNovelRequest:
    properties:
      authorName:
        description: 小说作者
        type: string
      coverUrl:
        description: 小说封面 URL
        type: string
      intro:
        description: 小说简介
        type: string
      metadata:
        description: 小说元数据（标签信息）
        type: object
      title:
        description: 书名，必填
        type: string
    required:
    - title
    type: object
  novel.nextChapterNoResponse:
    properties:
      chapterNo:
        type: integer
    type: object
  novel.novelListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/novel.novelResponse'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  novel.novelResponse:
    properties:
      authorName:
        description: 小说作者
        type: string
      coverUrl:
        description: 小说封面 URL
        type: string
      createdAt:
        description: 创建时间
        type: string
      id:
        description: 小说 ID
        type: integer
      intro:
        description: 小说简介
        type: string
      metadata:
        description: 小说元数据（标签信息）
        type: object
      title:
        description: 书名
        type: string
      wordCount:
        description: 小说字数
        type: integer
    type: object
  novel.updateChapterRequest:
    properties:
      chapterNo:
        description: 章节编号
        type: integer
      content:
        description: 章节内容
        type: string
      title:
        description: 章节标题
        type: string
      wordCount:
        description: 章节字数
        type: integer
    type: object
  novel.updateCharacterRequest:
    properties:
      ability:
        description: 角色能力
        type: string
      appearance:
        description: 角色外貌
        type: string
      appearanceImgUrl:
        description: 角色形象图 URL
        type: string
      background:
        description: 角色背景
        type: string
      charactersTags:
        description: 角色标签；使用指针用于区分“未传”和“传空数组”
        items:
          type: string
        type: array
      firstAppearanceChapterId:
        description: 首次出现章节 ID
        type: integer
      gender:
        description: 角色性别
        type: string
      intro:
        description: 角色介绍
        type: string
      motivation:
        description: 角色动机
        type: string
      name:
        description: 角色名称
        type: string
      personality:
        description: 角色性格
        type: string
      plotDirection:
        description: 角色剧情方向
        type: string
      status:
        description: 角色状态：1 在线，2 下线
        type: integer
    type: object
  novel.updateNovelRequest:
    properties:
      authorName:
        description: 小说作者
        type: string
      coverUrl:
        description: 小说封面 URL
        type: string
      id:
        description: 小说 ID，必填
        type: integer
      intro:
        description: 小说简介
        type: string
      metadata:
        description: 小说元数据（标签信息）
        type: object
      title:
        description: 书名
        type: string
    required:
    - id
    type: object
  upload.uploadResponse:
    properties:
      key:
        description: Key 文件在 S3/对象存储桶里的对象路径，相当于存储内部的文件名
        type: string
      url:
        description: URL 前端可以直接访问的公开地址，是用配置里的 public_base_url 加上 key 拼出来的
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: AI小说系统接口文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: AI小说系统接口文档
  version: "1.0"
paths:
  /ai-providers:
    get:
      description: 分页查询 AI 提供商列表，列表不返回 API Key
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 10，最大 100
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/aiprovider.aiProviderListResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 查询 AI 提供商列表
      tags:
      - ai-provider
    post:
      consumes:
      - application/json
      description: 创建 AI 提供商，API Key 入库前会加密
      parameters:
      - description: AI 提供商信息
        in: body
        name: provider
        required: true
        schema:
          $ref: '#/definitions/aiprovider.createAIProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/aiprovider.aiProviderResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 新增 AI 提供商
      tags:
      - ai-provider
  /ai-providers/{id}:
    delete:
      description: 按 ID 物理删除 AI 提供商
      parameters:
      - description: AI 提供商 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: AI 提供商不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 删除 AI 提供商
      tags:
      - ai-provider
    get:
      description: 按 ID 查询 AI 提供商详情，返回解密后的 API Key
      parameters:
      - description: AI 提供商 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/aiprovider.aiProviderResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: AI 提供商不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 查询 AI 提供商详情
      tags:
      - ai-provider
    put:
      consumes:
      - application/json
      description: 按 ID 局部更新 AI 提供商，传入 API Key 时重新加密
      parameters:
      - description: AI 提供商 ID
        in: path
        name: id
        required: true
        type: integer
      - description: AI 提供商信息
        in: body
        name: provider
        required: true
        schema:
          $ref: '#/definitions/aiprovider.updateAIProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/aiprovider.aiProviderResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: AI 提供商不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 更新 AI 提供商
      tags:
      - ai-provider
  /login:
    post:
      consumes:
      - application/json
      description: 登陆接口，只需要接受密码
      parameters:
      - description: 密码
        in: body
        name: password
        required: true
        schema:
          $ref: '#/definitions/login.passwordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code = 0，表示登陆成功; code = 1000，表示没有初始密码,登陆失败
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 登陆接口
      tags:
      - login
  /login/initial-password:
    get:
      description: 检查管理员初始化密码是否已经设置
      produces:
      - application/json
      responses:
        "200":
          description: code = 0 表示检查成功;data.initialized 表示是否已设置初始化密码
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  additionalProperties:
                    type: boolean
                  type: object
              type: object
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 检查初始化密码
      tags:
      - login
  /login/password:
    post:
      consumes:
      - application/json
      description: 仅在管理员密码为空时允许设置初始化密码
      parameters:
      - description: Password
        in: body
        name: password
        required: true
        schema:
          $ref: '#/definitions/login.passwordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code = 0，表示设置成功;code = 1001，表示密码已设置
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 设置初始化密码
      tags:
      - login
  /novels:
    get:
      description: 分页查询小说列表
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 10，最大 100
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/novel.novelListResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 查询小说列表
      tags:
      - novel
    post:
      consumes:
      - application/json
      description: 创建小说，仅书名必填
      parameters:
      - description: 小说信息
        in: body
        name: novel
        required: true
        schema:
          $ref: '#/definitions/novel.createNovelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/novel.novelResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 新增小说
      tags:
      - novel
  /novels/{id}:
    delete:
      description: 按 ID 软删除小说
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 小说不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 删除小说
      tags:
      - novel
    get:
      description: 按 ID 查询单本小说
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/novel.novelResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 小说不存在
          schema:
