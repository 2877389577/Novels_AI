            $ref: '#/definitions/common.Response'
        "404":
          description: 小说不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 查询下一章编号
      tags:
      - chapter
  /novels/{id}/character-relation-graph:
    get:
      description: 查询指定小说下的角色关系图数据，返回 Vue Flow 可直接使用的 nodes 和 edges。nodes 中每个节点代表一个角色，id
        为角色 ID 的字符串形式；edges 中每条边代表一条启用的角色关系，source 和 target 分别对应起始角色和目标角色。
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code = 0 表示查询成功；data.nodes 为角色节点列表；data.edges 为角色关系连线列表
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/novel.characterRelationGraphResponse'
              type: object
        "400":
          description: 请求参数错误，例如小说 ID 不是正整数
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 小说不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 查询角色关系图
      tags:
      - character-relation
  /novels/{id}/character-relation-graph/nodes/layout:
    put:
      consumes:
      - application/json
      description: 批量保存指定小说下角色节点在 Vue Flow 画布中的位置、尺寸、隐藏状态、锁定状态和样式。后端按 novelId + characterId
        更新已有布局，不存在则新增；不会删除本次未提交的其他节点布局。
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 节点布局列表。nodes[].characterId 为角色 ID；nodes[].positionX 和 nodes[].positionY
          为画布坐标；nodes[].style 和 nodes[].extraData 可保存前端扩展 JSON
        in: body
        name: layout
        required: true
        schema:
          $ref: '#/definitions/dto.SaveCharacterRelationNodeLayoutsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code = 0 表示保存成功；data 返回本次保存后的节点布局
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/novel.characterRelationNodeLayoutResponse'
                  type: array
              type: object
        "400":
          description: 请求参数错误，例如节点列表为空、角色 ID 为空或节点状态不是 1/2
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 小说或角色不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 保存角色关系图节点布局
      tags:
      - character-relation
  /novels/{id}/character-relations:
    get:
      description: 查询指定小说下所有角色关系，包含启用和停用状态。该接口用于关系管理列表，关系图展示接口只返回 status = 1 的启用关系。
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code = 0 表示查询成功；data.items 为关系列表；data.total 为关系总数
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/novel.characterRelationListResponse'
              type: object
        "400":
          description: 请求参数错误，例如小说 ID 不是正整数
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 小说不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 查询角色关系列表
      tags:
      - character-relation
    post:
      consumes:
      - application/json
      description: 给指定小说新增一条角色关系。sourceCharacterId 和 targetCharacterId 必须都属于当前小说，且不能相同；同一小说、同一组角色、同一
        relationType 只能存在一条未删除关系。
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 角色关系信息。relationType 是关系类型编码；relationLabel 是前端展示名称；direction 为
          1 单向、2 双向或无向；style 和 extraData 可保存前端扩展 JSON
        in: body
        name: relation
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCharacterRelationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code = 0 表示新增成功；data 为新增后的角色关系
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/novel.characterRelationResponse'
              type: object
        "400":
          description: 请求参数错误，例如角色 ID 为空、关系类型为空、关系名称为空、方向或状态不正确、角色关联到自己
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 小说或角色不存在
          schema:
            $ref: '#/definitions/common.Response'
        "409":
          description: 角色关系已存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 新增角色关系
      tags:
      - character-relation
  /novels/{id}/character-relations/{relationId}:
    delete:
      description: 物理删除指定小说下的角色关系。删除后该关系记录会从数据库移除，不会再出现在角色关系图 edges 中。
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 角色关系 ID
        in: path
        name: relationId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code = 0 表示删除成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 请求参数错误，例如小说 ID 或关系 ID 不是正整数
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 小说或角色关系不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 删除角色关系
      tags:
      - character-relation
    get:
      description: 查询指定小说下的单条角色关系详情，返回关系类型、展示名称、方向、样式和扩展数据等完整信息。
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 角色关系 ID
        in: path
        name: relationId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code = 0 表示查询成功；data 为角色关系详情
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/novel.characterRelationResponse'
              type: object
        "400":
          description: 请求参数错误，例如小说 ID 或关系 ID 不是正整数
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 小说或角色关系不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 查询角色关系详情
      tags:
      - character-relation
    put:
      consumes:
      - application/json
      description: 全量更新指定小说下的角色关系。请求体需要传入完整关系信息；sourceCharacterId 和 targetCharacterId
        必须都属于当前小说，且不能相同。
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 角色关系 ID
        in: path
        name: relationId
        required: true
        type: integer
      - description: 角色关系信息。direction 必填且只能为 1 或 2；status 必填且只能为 1 或 2；style 和 extraData
          会全量覆盖原值
        in: body
        name: relation
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCharacterRelationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code = 0 表示更新成功；data 为更新后的角色关系
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/novel.characterRelationResponse'
              type: object
        "400":
          description: 请求参数错误，例如角色 ID 为空、关系类型为空、方向或状态不正确、角色关联到自己
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 小说、角色或角色关系不存在
          schema:
            $ref: '#/definitions/common.Response'
        "409":
          description: 角色关系已存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 修改角色关系
      tags:
      - character-relation
