basePath: /api/v1
definitions:
  ai_tools.CharacterCardTool:
    properties:
      ability:
        type: string
      appearance:
        type: string
      gender:
        type: string
      intro:
        type: string
      name:
        type: string
      personality:
        type: string
    type: object
  aiprovider.aiProviderListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/aiprovider.aiProviderResponse'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  aiprovider.aiProviderModelsResponse:
    properties:
      models:
        description: 支持的模型 ID 列表
        items:
          type: string
        type: array
    type: object
  aiprovider.aiProviderResponse:
    properties:
      apiKey:
        description: API Key 明文，仅详情类响应返回
        type: string
      baseUrl:
        description: ai 提供商基础 URL
        type: string
      configJson:
        description: ai 提供商额外配置
        type: object
      createdAt:
        description: 创建时间
        type: string
      id:
        description: ai 提供商 ID
        type: integer
      isEnabled:
        description: 是否启用
        type: boolean
      maxContextLength:
        description: 最大上下文长度
        type: integer
      maxInputTokens:
        description: 最大输入令牌数
        type: integer
      maxOutputTokens:
        description: 最大输出令牌数
        type: integer
      models:
        description: 支持的模型列表
        items:
          type: string
        type: array
      name:
        description: ai 提供商名称
        type: string
      providerType:
        description: ai 提供商类型
        type: string
      updatedAt:
        description: 更新时间
        type: string
    type: object
  common.Response:
    properties:
      code:
        description: 状态码
        type: integer
      data:
        description: 数据
      msg:
        description: 状态描述
        type: string
    type: object
  common.SystemError:
    properties:
      code:
        description: Code 是业务错误码，统一写入响应体，方便前端按业务场景处理。
        type: integer
      msg:
        description: Msg 是展示给调用方的错误提示，保持和业务错误定义在同一处维护。
        type: string
    type: object
  dto.CharacterRelationNodeLayoutRequest:
    properties:
      characterId:
        description: 角色 ID，必须属于当前小说。
        type: integer
      extraData:
        description: 节点扩展数据，用于保存前端未来新增的非固定字段。
        type: object
      height:
        description: 节点高度，前端需要记忆尺寸时传入。
        type: number
      hidden:
        description: 是否隐藏该节点。
        type: boolean
      locked:
        description: 是否锁定该节点位置。
        type: boolean
      positionX:
        description: 节点在画布上的 X 坐标。
        type: number
      positionY:
        description: 节点在画布上的 Y 坐标。
        type: number
      status:
        description: 节点状态：1 启用，2 停用。不传时默认 1。
        enum:
        - 1
        - 2
        type: integer
      style:
        description: 节点展示样式，保存 Vue Flow 需要的样式扩展。
        type: object
      type:
        description: Vue Flow 节点类型，不传时默认 character。
        type: string
      width:
        description: 节点宽度，前端需要记忆尺寸时传入。
        type: number
    required:
    - characterId
    type: object
  dto.CreateAIProviderRequest:
    properties:
      apiKey:
        description: API Key 明文，必填，业务层会在入库前加密。
        type: string
      baseUrl:
        description: ai 提供商基础 URL，必填。
        type: string
      configJson:
        description: ai 提供商额外配置。
        type: object
      isEnabled:
        description: 是否启用；不传时由业务层默认启用。
        type: boolean
      maxContextLength:
        description: 最大上下文长度，不传时使用数据库字段零值。
        type: integer
      maxInputTokens:
        description: 最大输入令牌数，不传时使用数据库字段零值。
        type: integer
      maxOutputTokens:
        description: 最大输出令牌数，不传时使用数据库字段零值。
        type: integer
      models:
        description: 支持的模型列表。
        items:
          type: string
        type: array
      name:
        description: ai 提供商名称，必填。
        type: string
      providerType:
        description: ai 提供商类型，必填。
        type: string
    required:
    - apiKey
    - baseUrl
    - name
    - providerType
    type: object
  dto.CreateChapterRequest:
    properties:
      chapterNo:
        description: 章节编号，必填且大于 0。
        type: integer
      content:
        description: 章节内容，必填。
        type: string
      title:
        description: 章节标题，必填。
        type: string
      wordCount:
        description: 章节字数，不能小于 0。
        minimum: 0
        type: integer
    required:
    - chapterNo
    - content
    - title
    type: object
  dto.CreateCharacterRelationRequest:
    properties:
      animated:
        description: 是否用动画线展示关系。
        type: boolean
      description:
        description: 关系说明，用于展示两个角色关系的背景或补充信息。
        type: string
      direction:
        description: 关系方向：1 单向，2 双向或无向。不传时默认 2。
        enum:
        - 1
        - 2
        type: integer
      edgeType:
        description: Vue Flow 边类型，不传时默认 default。
        type: string
      extraData:
        description: 关系扩展数据，用于保存前端未来新增的非固定字段。
        type: object
      relationLabel:
        description: 关系展示名称，例如 父女、好友、宿敌、师徒。
        type: string
      relationType:
        description: 关系类型编码，例如 family、friend、enemy、lover、teacher、other。
        type: string
      sortOrder:
        description: 排序值，前端可用于控制多条关系线的展示顺序。
        type: integer
      sourceCharacterId:
        description: 起始角色 ID，对应 Vue Flow edge.source。
        type: integer
      sourceHandle:
        description: Vue Flow 起始连接桩 ID。
        type: string
      status:
        description: 关系状态：1 启用，2 停用。不传时默认 1。
        enum:
        - 1
        - 2
        type: integer
      style:
        description: 关系线展示样式，保存 Vue Flow 需要的样式扩展。
        type: object
      targetCharacterId:
        description: 目标角色 ID，对应 Vue Flow edge.target。
        type: integer
      targetHandle:
        description: Vue Flow 目标连接桩 ID。
        type: string
    required:
    - relationLabel
    - relationType
    - sourceCharacterId
    - targetCharacterId
    type: object
  dto.CreateCharacterRequest:
    properties:
      ability:
        description: 角色能力。
        type: string
      appearance:
        description: 角色外貌。
        type: string
      appearanceImgUrl:
        description: 角色形象图 URL。
        type: string
      background:
        description: 角色背景。
        type: string
      charactersTags:
        description: 角色标签。
        items:
          type: string
        type: array
      firstAppearanceChapterId:
        description: 首次出现章节 ID。
        type: integer
      gender:
        description: 角色性别。
        type: string
      intro:
        description: 角色介绍。
        type: string
      motivation:
        description: 角色动机。
        type: string
      name:
        description: 角色名称，必填。
        type: string
      personality:
        description: 角色性格。
        type: string
      plotDirection:
        description: 角色剧情方向。
        type: string
      status:
        description: 角色状态：1 在线，2 下线。
        type: integer
    required:
    - name
    type: object
  dto.CreateNovelRequest:
    properties:
      authorName:
        description: 小说作者。
        type: string
      coverUrl:
        description: 小说封面 URL。
        type: string
      intro:
        description: 小说简介。
        type: string
      metadata:
        description: 小说元数据（标签信息）。
        type: object
      title:
        description: 书名，必填。
        type: string
    required:
    - title
    type: object
  dto.EnableAIProviderRequest:
    properties:
      id:
        description: ID 是需要被设置为启用状态的 ai 提供商主键。
        type: integer
    required:
    - id
    type: object
  dto.PasswordRequest:
    properties:
      password:
        description: 管理员密码，必填。
        type: string
    required:
    - password
    type: object
  dto.QueryAIProviderModelsRequest:
    properties:
      apiKey:
        description: API Key 明文，仅用于本次上游查询，不入库也不返回。
        type: string
      baseUrl:
        description: ai 提供商基础 URL，后端会按 OpenAI 兼容协议拼接到 /v1/models。
        type: string
    required:
    - apiKey
    - baseUrl
    type: object
  dto.SaveCharacterRelationNodeLayoutsRequest:
    properties:
      nodes:
        description: 需要保存布局的节点列表，至少传入一个节点。
        items:
          $ref: '#/definitions/dto.CharacterRelationNodeLayoutRequest'
        minItems: 1
        type: array
    required:
    - nodes
    type: object
  dto.UpdateAIProviderRequest:
    properties:
      apiKey:
        description: API Key 明文，必填，业务层会在入库前重新加密。
        type: string
      baseUrl:
        description: ai 提供商基础 URL，必填。
        type: string
      configJson:
        description: ai 提供商额外配置。
        type: object
      isEnabled:
        description: 是否启用。
        type: boolean
      maxContextLength:
        description: 最大上下文长度。
        type: integer
      maxInputTokens:
        description: 最大输入令牌数。
        type: integer
      maxOutputTokens:
        description: 最大输出令牌数。
        type: integer
      models:
        description: 支持的模型列表。
        items:
          type: string
        type: array
      name:
        description: ai 提供商名称，必填。
        type: string
      providerType:
        description: ai 提供商类型，必填。
        type: string
    required:
    - apiKey
    - baseUrl
    - name
    - providerType
    type: object
  dto.UpdateChapterRequest:
    properties:
      chapterNo:
        description: 章节编号，必填且大于 0。
        type: integer
      content:
        description: 章节内容，必填。
        type: string
      title:
        description: 章节标题，必填。
        type: string
      wordCount:
        description: 章节字数，不能小于 0。
        minimum: 0
        type: integer
    required:
    - chapterNo
    - content
    - title
    type: object
  dto.UpdateCharacterRelationRequest:
    properties:
      animated:
        description: 是否用动画线展示关系。
        type: boolean
      description:
        description: 关系说明，用于展示两个角色关系的背景或补充信息。
        type: string
      direction:
        description: 关系方向：1 单向，2 双向或无向。
        enum:
        - 1
        - 2
        type: integer
      edgeType:
        description: Vue Flow 边类型，不传时默认 default。
        type: string
      extraData:
        description: 关系扩展数据，用于保存前端未来新增的非固定字段。
        type: object
      relationLabel:
        description: 关系展示名称，例如 父女、好友、宿敌、师徒。
        type: string
      relationType:
        description: 关系类型编码，例如 family、friend、enemy、lover、teacher、other。
        type: string
      sortOrder:
        description: 排序值，前端可用于控制多条关系线的展示顺序。
        type: integer
      sourceCharacterId:
        description: 起始角色 ID，对应 Vue Flow edge.source。
        type: integer
      sourceHandle:
        description: Vue Flow 起始连接桩 ID。
        type: string
      status:
        description: 关系状态：1 启用，2 停用。
        enum:
        - 1
        - 2
        type: integer
      style:
        description: 关系线展示样式，保存 Vue Flow 需要的样式扩展。
        type: object
      targetCharacterId:
        description: 目标角色 ID，对应 Vue Flow edge.target。
        type: integer
      targetHandle:
        description: Vue Flow 目标连接桩 ID。
        type: string
    required:
    - direction
    - relationLabel
    - relationType
    - sourceCharacterId
    - status
    - targetCharacterId
    type: object
  dto.UpdateCharacterRequest:
    properties:
      ability:
        description: 角色能力。
        type: string
      appearance:
        description: 角色外貌。
        type: string
      appearanceImgUrl:
        description: 角色形象图 URL。
        type: string
      background:
        description: 角色背景。
        type: string
      charactersTags:
        description: 角色标签。
        items:
          type: string
        type: array
      firstAppearanceChapterId:
        description: 首次出现章节 ID。
        type: integer
      gender:
        description: 角色性别。
        type: string
      intro:
        description: 角色介绍。
        type: string
      motivation:
        description: 角色动机。
        type: string
      name:
        description: 角色名称，必填。
        type: string
      personality:
        description: 角色性格。
        type: string
      plotDirection:
        description: 角色剧情方向。
        type: string
      status:
        description: 角色状态：1 在线，2 下线。
        type: integer
    required:
    - name
    type: object
  dto.UpdateNovelRequest:
    properties:
      authorName:
        description: 小说作者。
        type: string
      coverUrl:
        description: 小说封面 URL。
        type: string
      id:
        description: 小说 ID，必填。
        type: integer
      intro:
        description: 小说简介。
        type: string
      metadata:
        description: 小说元数据（标签信息）。
        type: object
      title:
        description: 书名，必填。
        type: string
      wordCount:
        description: 小说字数。
        minimum: 0
        type: integer
    required:
    - id
    - title
    type: object
  novel.chapterListItemResponse:
    properties:
      chapterNo:
        description: 章节编号
        type: integer
      createdAt:
        description: 创建时间
        type: string
      id:
        description: 章节 ID
        type: integer
      novelId:
        description: 小说 ID
        type: integer
      title:
        description: 章节标题
        type: string
      updatedAt:
        description: 更新时间
        type: string
      wordCount:
        description: 章节字数
        type: integer
    type: object
  novel.chapterListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/novel.chapterListItemResponse'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  novel.chapterResponse:
    properties:
      chapterNo:
        description: 章节编号
        type: integer
      content:
        description: 章节内容
        type: string
      createdAt:
        description: 创建时间
        type: string
      id:
        description: 章节 ID
        type: integer
      novelId:
        description: 小说 ID
        type: integer
      title:
        description: 章节标题
        type: string
      updatedAt:
        description: 更新时间
        type: string
      wordCount:
        description: 章节字数
        type: integer
    type: object
  novel.characterListItemResponse:
    properties:
      appearanceImgUrl:
        description: 角色形象图 URL
