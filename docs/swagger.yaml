      charactersTags:
        description: 角色标签
        items:
          type: string
        type: array
      gender:
        description: 角色性别
        type: string
      id:
        description: 角色 ID
        type: integer
      name:
        description: 角色名称
        type: string
      status:
        description: 角色状态：1 在线，2 下线
        type: integer
    type: object
  novel.characterListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/novel.characterListItemResponse'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  novel.characterRelationGraphEdgeDataResponse:
    properties:
      description:
        description: 关系说明。
        type: string
      direction:
        description: 关系方向：1 单向，2 双向或无向。
        type: integer
      extraData:
        description: 关系扩展数据。
        type: object
      novelId:
        description: 小说 ID。
        type: integer
      relationId:
        description: 角色关系 ID。
        type: integer
      relationLabel:
        description: 关系展示名称。
        type: string
      relationType:
        description: 关系类型编码。
        type: string
      sortOrder:
        description: 排序值。
        type: integer
      sourceCharacterId:
        description: 起始角色 ID。
        type: integer
      status:
        description: 关系状态：1 启用，2 停用。
        type: integer
      targetCharacterId:
        description: 目标角色 ID。
        type: integer
    type: object
  novel.characterRelationGraphEdgeResponse:
    properties:
      animated:
        description: 是否动画展示。
        type: boolean
      data:
        allOf:
        - $ref: '#/definitions/novel.characterRelationGraphEdgeDataResponse'
        description: 关系业务数据和扩展数据。
      id:
        description: Vue Flow 边 ID，等于角色关系 ID 的字符串形式。
        type: string
      label:
        description: 关系展示名称，会展示在线条标签上。
        type: string
      source:
        description: Vue Flow 起始节点 ID，等于起始角色 ID 的字符串形式。
        type: string
      sourceHandle:
        description: 起始连接桩 ID。
        type: string
      style:
        description: Vue Flow 边样式。
        type: object
      target:
        description: Vue Flow 目标节点 ID，等于目标角色 ID 的字符串形式。
        type: string
      targetHandle:
        description: 目标连接桩 ID。
        type: string
      type:
        description: Vue Flow 边类型，默认 default。
        type: string
    type: object
  novel.characterRelationGraphNodeDataResponse:
    properties:
      appearanceImgUrl:
        description: 角色形象图 URL。
        type: string
      characterId:
        description: 角色 ID。
        type: integer
      characterStatus:
        description: 角色状态：1 在线，2 下线。
        type: integer
      charactersTags:
        description: 角色标签。
        items:
          type: string
        type: array
      extraData:
        description: 节点扩展数据。
        type: object
      gender:
        description: 角色性别。
        type: string
      layoutId:
        description: 节点布局 ID，未保存布局时为空。
        type: integer
      locked:
        description: 是否锁定节点位置。
        type: boolean
      name:
        description: 角色名称。
        type: string
      nodeStatus:
        description: 节点布局状态：1 启用，2 停用。
        type: integer
      novelId:
        description: 小说 ID。
        type: integer
    type: object
  novel.characterRelationGraphNodeResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/novel.characterRelationGraphNodeDataResponse'
        description: 节点渲染所需角色数据和扩展数据。
      height:
        description: 节点高度，未保存时为空。
        type: number
      hidden:
        description: 是否隐藏节点。
        type: boolean
      id:
        description: Vue Flow 节点 ID，等于角色 ID 的字符串形式。
        type: string
      locked:
        description: 是否锁定节点位置。
        type: boolean
      position:
        allOf:
        - $ref: '#/definitions/novel.vueFlowPositionResponse'
        description: Vue Flow 节点位置。
      style:
        description: Vue Flow 节点样式。
        type: object
      type:
        description: Vue Flow 节点类型，默认 character。
        type: string
      width:
        description: 节点宽度，未保存时为空。
        type: number
    type: object
  novel.characterRelationGraphResponse:
    properties:
      edges:
        description: Vue Flow 边列表，边 ID 使用角色关系 ID 的字符串形式。
        items:
          $ref: '#/definitions/novel.characterRelationGraphEdgeResponse'
        type: array
      nodes:
        description: Vue Flow 节点列表，节点 ID 使用角色 ID 的字符串形式。
        items:
          $ref: '#/definitions/novel.characterRelationGraphNodeResponse'
        type: array
    type: object
  novel.characterRelationListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/novel.characterRelationResponse'
        type: array
      total:
        type: integer
    type: object
  novel.characterRelationNodeLayoutResponse:
    properties:
      characterId:
        description: 角色 ID。
        type: integer
      createdAt:
        description: 创建时间。
        type: string
      extraData:
        description: 节点扩展数据。
        type: object
      height:
        description: 节点高度。
        type: number
      hidden:
        description: 是否隐藏。
        type: boolean
      id:
        description: 节点布局 ID。
        type: integer
      locked:
        description: 是否锁定。
        type: boolean
      novelId:
        description: 小说 ID。
        type: integer
      positionX:
        description: X 坐标。
        type: number
      positionY:
        description: Y 坐标。
        type: number
      status:
        description: 节点状态：1 启用，2 停用。
        type: integer
      style:
        description: 节点样式。
        type: object
      type:
        description: Vue Flow 节点类型。
        type: string
      updatedAt:
        description: 更新时间。
        type: string
      width:
        description: 节点宽度。
        type: number
    type: object
  novel.characterRelationResponse:
    properties:
      animated:
        description: 是否动画展示。
        type: boolean
      createdAt:
        description: 创建时间。
        type: string
