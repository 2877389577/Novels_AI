basePath: /api/v1
definitions:
  common.Response:
    properties:
      code:
        description: 状态码
        type: integer
      data:
        description: 数据
      msg:
        description: 状态描述
        type: string
    type: object
  common.SystemError:
    properties:
      code:
        type: integer
      msg:
        type: string
    type: object
  login.passwordRequest:
    properties:
      password:
        type: string
    type: object
  novel.createNovelRequest:
    properties:
      authorName:
        description: 小说作者
        type: string
      coverUrl:
        description: 小说封面 URL
        type: string
      intro:
        description: 小说简介
        type: string
      metadata:
        description: 小说元数据（标签信息）
        type: object
      title:
        description: 书名，必填
        type: string
    required:
    - title
    type: object
  novel.novelListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/novel.novelResponse'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  novel.novelResponse:
    properties:
      authorName:
        description: 小说作者
        type: string
      coverUrl:
        description: 小说封面 URL
        type: string
      createdAt:
        description: 创建时间
        type: string
      id:
        description: 小说 ID
        type: integer
      intro:
        description: 小说简介
        type: string
      metadata:
        description: 小说元数据（标签信息）
        type: object
      title:
        description: 书名
        type: string
      wordCount:
        description: 小说字数
        type: integer
    type: object
  novel.updateNovelRequest:
    type: object
  upload.uploadResponse:
    properties:
      key:
        description: Key 文件在 S3/对象存储桶里的对象路径，相当于存储内部的文件名
        type: string
      url:
        description: URL 前端可以直接访问的公开地址，是用配置里的 public_base_url 加上 key 拼出来的
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: AI小说系统接口文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: AI小说系统接口文档
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: 登陆接口，只需要接受密码
      parameters:
      - description: 密码
        in: body
        name: password
        required: true
        schema:
          $ref: '#/definitions/login.passwordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code = 0，表示登陆成功; code = 1000，表示没有初始密码,登陆失败
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 登陆接口
      tags:
      - login
  /login/initial-password:
    get:
      description: 检查管理员初始化密码是否已经设置
      produces:
      - application/json
      responses:
        "200":
          description: code = 0 表示检查成功;data.initialized 表示是否已设置初始化密码
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  additionalProperties:
                    type: boolean
                  type: object
              type: object
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 检查初始化密码
      tags:
      - login
  /login/password:
    post:
      consumes:
      - application/json
      description: 仅在管理员密码为空时允许设置初始化密码
      parameters:
      - description: Password
        in: body
        name: password
        required: true
        schema:
          $ref: '#/definitions/login.passwordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code = 0，表示设置成功;code = 1001，表示密码已设置
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 设置初始化密码
      tags:
      - login
  /novels:
    get:
      description: 分页查询小说列表
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 10，最大 100
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/novel.novelListResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 查询小说列表
      tags:
      - novel
    post:
      consumes:
      - application/json
      description: 创建小说，仅书名必填
      parameters:
      - description: 小说信息
        in: body
        name: novel
        required: true
        schema:
          $ref: '#/definitions/novel.createNovelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/novel.novelResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 新增小说
      tags:
      - novel
  /novels/{id}:
    delete:
      description: 按 ID 软删除小说
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 小说不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 删除小说
      tags:
      - novel
    get:
      description: 按 ID 查询单本小说
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/novel.novelResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 小说不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 查询小说详情
      tags:
      - novel
  /novels/update:
    put:
      consumes:
      - application/json
      description: 按 ID 局部更新小说
      parameters:
      - description: 小说信息
        in: body
        name: novel
        required: true
        schema:
          $ref: '#/definitions/novel.updateNovelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/novel.novelResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 小说不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 更新小说
      tags:
      - novel
  /upload:
    post:
      consumes:
      - multipart/form-data
      description: 使用 S3 兼容对象存储上传文件，返回公开访问地址
      parameters:
      - description: 文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/upload.uploadResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 上传文件
      tags:
      - upload
swagger: "2.0"
