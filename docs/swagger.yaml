basePath: /api/v1
definitions:
  common.Response:
    properties:
      code:
        description: 状态码
        type: integer
      data:
        description: 数据
      msg:
        description: 状态描述
        type: string
    type: object
  common.SystemError:
    properties:
      code:
        type: integer
      msg:
        type: string
    type: object
  login.passwordRequest:
    properties:
      password:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: AI小说系统接口文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: AI小说系统接口文档
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: 登陆接口，只需要接受密码
      parameters:
      - description: Password
        in: body
        name: password
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: code = 0，表示登陆成功,code = 1000，表示没有初始密码,登陆失败
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 登陆接口
  /login/initial-password:
    get:
      description: 检查管理员初始化密码是否已经设置
      produces:
      - application/json
      responses:
        "200":
          description: 检查成功
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  additionalProperties:
                    type: boolean
                  type: object
              type: object
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 检查初始化密码
  /login/password:
    post:
      consumes:
      - application/json
      description: 仅在管理员密码为空时允许设置初始化密码
      parameters:
      - description: Password
        in: body
        name: password
        required: true
        schema:
          $ref: '#/definitions/login.passwordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code = 0，表示设置成功;code = 1001，表示密码已设置
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 设置初始化密码
swagger: "2.0"
