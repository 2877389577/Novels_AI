        description: URL 前端可以直接访问的公开地址，是用配置里的 public_base_url 加上 key 拼出来的
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: AI小说系统接口文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: AI小说系统接口文档
  version: "1.0"
paths:
  /ai-providers:
    get:
      description: 分页查询 ai 提供商列表，列表不返回 API Key
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 10，最大 100
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/aiprovider.aiProviderListResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 查询 ai 提供商列表
      tags:
      - ai-provider
    post:
      consumes:
      - application/json
      description: 创建 ai 提供商，API Key 入库前会加密
      parameters:
      - description: ai 提供商信息
        in: body
        name: provider
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAIProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/aiprovider.aiProviderResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 新增 ai 提供商
      tags:
      - ai-provider
  /ai-providers/{id}:
    delete:
      description: 按 ID 物理删除 ai 提供商
      parameters:
      - description: ai 提供商 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: ai 提供商不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 删除 ai 提供商
      tags:
      - ai-provider
    get:
      description: 按 ID 查询 ai 提供商详情，返回解密后的 API Key
      parameters:
      - description: ai 提供商 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/aiprovider.aiProviderResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: ai 提供商不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 查询 ai 提供商详情
      tags:
      - ai-provider
    put:
      consumes:
      - application/json
      description: 按 ID 全量更新 ai 提供商，API Key 会重新加密
      parameters:
      - description: ai 提供商 ID
        in: path
        name: id
        required: true
        type: integer
      - description: ai 提供商信息
        in: body
        name: provider
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAIProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/aiprovider.aiProviderResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: ai 提供商不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 更新 ai 提供商
      tags:
      - ai-provider
  /ai-providers/enable:
    post:
      consumes:
      - application/json
      description: 将当前已启用的 ai 提供商全部设为未启用，再启用请求中指定的 ai 提供商
      parameters:
      - description: 需要启用的 ai 提供商 ID
        in: body
        name: provider
        required: true
        schema:
          $ref: '#/definitions/dto.EnableAIProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: ai 提供商不存在
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 一键启用 ai 提供商
      tags:
      - ai-provider
  /ai-providers/models/query:
    post:
      consumes:
      - application/json
      description: 使用前端传入的 baseUrl 和 apiKey，按 OpenAI 兼容 /v1/models 协议查询模型 ID 列表；不会写入数据库
      parameters:
      - description: ai 提供商连接信息
        in: body
        name: provider
        required: true
        schema:
          $ref: '#/definitions/dto.QueryAIProviderModelsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/aiprovider.aiProviderModelsResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
        "502":
          description: ai 提供商模型查询失败
          schema:
            $ref: '#/definitions/common.Response'
      summary: 查询 ai 提供商模型列表
      tags:
      - ai-provider
  /login:
    post:
      consumes:
      - application/json
      description: 登陆接口，只需要接受密码
      parameters:
      - description: 密码
        in: body
        name: password
        required: true
        schema:
          $ref: '#/definitions/dto.PasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code = 0，表示登陆成功; code = 1000，表示没有初始密码,登陆失败
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 系统错误
          schema:
            $ref: '#/definitions/common.SystemError'
      summary: 登陆接口
      tags:
      - login
  /login/initial-password:
    get:
      description: 检查管理员初始化密码是否已经设置
      produces:
      - application/json
      responses:
        "200":
          description: code = 0 表示检查成功;data.initialized 表示是否已设置初始化密码
          schema:
            allOf:
