basePath: /api/v1
definitions:
  aiprovider.aiProviderListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/aiprovider.aiProviderResponse'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  aiprovider.aiProviderModelsResponse:
    properties:
      models:
        description: 支持的模型 ID 列表
        items:
          type: string
        type: array
    type: object
  aiprovider.aiProviderResponse:
    properties:
      apiKey:
        description: API Key 明文，仅详情类响应返回
        type: string
      baseUrl:
        description: ai 提供商基础 URL
        type: string
      configJson:
        description: ai 提供商额外配置
        type: object
      createdAt:
        description: 创建时间
        type: string
      id:
        description: ai 提供商 ID
        type: integer
      isEnabled:
        description: 是否启用
        type: boolean
      maxContextLength:
        description: 最大上下文长度
        type: integer
      maxInputTokens:
        description: 最大输入令牌数
        type: integer
      maxOutputTokens:
        description: 最大输出令牌数
        type: integer
      models:
        description: 支持的模型列表
        items:
          type: string
        type: array
      name:
        description: ai 提供商名称
        type: string
      providerType:
        description: ai 提供商类型
        type: string
      updatedAt:
        description: 更新时间
        type: string
    type: object
  common.Response:
    properties:
      code:
        description: 状态码
        type: integer
      data:
        description: 数据
      msg:
        description: 状态描述
        type: string
    type: object
  common.SystemError:
    properties:
      code:
        description: Code 是业务错误码，统一写入响应体，方便前端按业务场景处理。
        type: integer
      msg:
        description: Msg 是展示给调用方的错误提示，保持和业务错误定义在同一处维护。
        type: string
    type: object
  dto.CreateAIProviderRequest:
    properties:
      apiKey:
        description: API Key 明文，必填，业务层会在入库前加密。
        type: string
      baseUrl:
        description: ai 提供商基础 URL，必填。
        type: string
      configJson:
        description: ai 提供商额外配置。
        type: object
      isEnabled:
        description: 是否启用；不传时由业务层默认启用。
        type: boolean
      maxContextLength:
        description: 最大上下文长度，不传时使用数据库字段零值。
        type: integer
      maxInputTokens:
        description: 最大输入令牌数，不传时使用数据库字段零值。
        type: integer
      maxOutputTokens:
        description: 最大输出令牌数，不传时使用数据库字段零值。
        type: integer
      models:
        description: 支持的模型列表。
        items:
          type: string
        type: array
      name:
        description: ai 提供商名称，必填。
        type: string
      providerType:
        description: ai 提供商类型，必填。
        type: string
    required:
    - apiKey
    - baseUrl
    - name
    - providerType
    type: object
  dto.CreateChapterRequest:
    properties:
      chapterNo:
        description: 章节编号，必填且大于 0。
        type: integer
      content:
        description: 章节内容，必填。
        type: string
      title:
        description: 章节标题，必填。
        type: string
      wordCount:
        description: 章节字数，不能小于 0。
        minimum: 0
        type: integer
    required:
    - chapterNo
    - content
    - title
    type: object
  dto.CreateCharacterRequest:
    properties:
      ability:
        description: 角色能力。
        type: string
      appearance:
        description: 角色外貌。
        type: string
      appearanceImgUrl:
        description: 角色形象图 URL。
        type: string
      background:
        description: 角色背景。
        type: string
      charactersTags:
        description: 角色标签。
        items:
          type: string
        type: array
      firstAppearanceChapterId:
        description: 首次出现章节 ID。
        type: integer
      gender:
        description: 角色性别。
        type: string
      intro:
        description: 角色介绍。
        type: string
      motivation:
        description: 角色动机。
        type: string
      name:
        description: 角色名称，必填。
        type: string
      personality:
        description: 角色性格。
        type: string
      plotDirection:
        description: 角色剧情方向。
        type: string
      status:
        description: 角色状态：1 在线，2 下线。
        type: integer
    required:
    - name
    type: object
  dto.CreateNovelRequest:
    properties:
      authorName:
        description: 小说作者。
        type: string
      coverUrl:
        description: 小说封面 URL。
        type: string
      intro:
        description: 小说简介。
        type: string
      metadata:
        description: 小说元数据（标签信息）。
        type: object
      title:
        description: 书名，必填。
        type: string
    required:
    - title
    type: object
  dto.EnableAIProviderRequest:
    properties:
      id:
        description: ID 是需要被设置为启用状态的 ai 提供商主键。
        type: integer
    required:
    - id
    type: object
  dto.PasswordRequest:
    properties:
      password:
        description: 管理员密码，必填。
        type: string
    required:
    - password
    type: object
  dto.QueryAIProviderModelsRequest:
    properties:
      apiKey:
        description: API Key 明文，仅用于本次上游查询，不入库也不返回。
        type: string
      baseUrl:
        description: ai 提供商基础 URL，后端会按 OpenAI 兼容协议拼接到 /v1/models。
        type: string
    required:
    - apiKey
    - baseUrl
    type: object
  dto.UpdateAIProviderRequest:
    properties:
      apiKey:
        description: API Key 明文，必填，业务层会在入库前重新加密。
        type: string
      baseUrl:
        description: ai 提供商基础 URL，必填。
        type: string
      configJson:
        description: ai 提供商额外配置。
        type: object
      isEnabled:
        description: 是否启用。
        type: boolean
      maxContextLength:
        description: 最大上下文长度。
        type: integer
      maxInputTokens:
        description: 最大输入令牌数。
        type: integer
      maxOutputTokens:
        description: 最大输出令牌数。
        type: integer
      models:
        description: 支持的模型列表。
        items:
          type: string
        type: array
      name:
        description: ai 提供商名称，必填。
        type: string
      providerType:
        description: ai 提供商类型，必填。
        type: string
    required:
    - apiKey
    - baseUrl
    - name
    - providerType
    type: object
  dto.UpdateChapterRequest:
    properties:
      chapterNo:
        description: 章节编号，必填且大于 0。
        type: integer
      content:
        description: 章节内容，必填。
        type: string
      title:
        description: 章节标题，必填。
        type: string
      wordCount:
        description: 章节字数，不能小于 0。
        minimum: 0
        type: integer
    required:
    - chapterNo
    - content
    - title
    type: object
  dto.UpdateCharacterRequest:
    properties:
      ability:
        description: 角色能力。
        type: string
      appearance:
        description: 角色外貌。
        type: string
      appearanceImgUrl:
        description: 角色形象图 URL。
        type: string
      background:
        description: 角色背景。
        type: string
      charactersTags:
        description: 角色标签。
        items:
          type: string
        type: array
      firstAppearanceChapterId:
        description: 首次出现章节 ID。
        type: integer
      gender:
        description: 角色性别。
        type: string
      intro:
        description: 角色介绍。
        type: string
      motivation:
        description: 角色动机。
        type: string
      name:
        description: 角色名称，必填。
        type: string
      personality:
        description: 角色性格。
        type: string
      plotDirection:
        description: 角色剧情方向。
        type: string
      status:
        description: 角色状态：1 在线，2 下线。
        type: integer
    required:
    - name
    type: object
  dto.UpdateNovelRequest:
    properties:
      authorName:
        description: 小说作者。
        type: string
      coverUrl:
        description: 小说封面 URL。
        type: string
      id:
        description: 小说 ID，必填。
        type: integer
      intro:
        description: 小说简介。
        type: string
      metadata:
        description: 小说元数据（标签信息）。
        type: object
      title:
        description: 书名，必填。
        type: string
      wordCount:
        description: 小说字数。
        minimum: 0
        type: integer
    required:
    - id
    - title
    type: object
  novel.chapterListItemResponse:
    properties:
      chapterNo:
        description: 章节编号
        type: integer
      createdAt:
        description: 创建时间
        type: string
      id:
        description: 章节 ID
        type: integer
      novelId:
        description: 小说 ID
        type: integer
      title:
        description: 章节标题
        type: string
      updatedAt:
        description: 更新时间
        type: string
      wordCount:
        description: 章节字数
        type: integer
    type: object
  novel.chapterListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/novel.chapterListItemResponse'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  novel.chapterResponse:
    properties:
      chapterNo:
        description: 章节编号
        type: integer
      content:
        description: 章节内容
        type: string
      createdAt:
        description: 创建时间
        type: string
      id:
        description: 章节 ID
        type: integer
      novelId:
        description: 小说 ID
        type: integer
      title:
        description: 章节标题
        type: string
      updatedAt:
        description: 更新时间
        type: string
      wordCount:
        description: 章节字数
        type: integer
    type: object
  novel.characterListItemResponse:
    properties:
      appearanceImgUrl:
        description: 角色形象图 URL
        type: string
      charactersTags:
        description: 角色标签
        items:
          type: string
        type: array
      gender:
        description: 角色性别
        type: string
      id:
        description: 角色 ID
        type: integer
      name:
        description: 角色名称
        type: string
      status:
        description: 角色状态：1 在线，2 下线
        type: integer
    type: object
  novel.characterListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/novel.characterListItemResponse'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  novel.characterResponse:
    properties:
      ability:
        description: 角色能力
        type: string
      appearance:
        description: 角色外貌
        type: string
      appearanceImgUrl:
        description: 角色形象图 URL
        type: string
      background:
        description: 角色背景
        type: string
      charactersTags:
        description: 角色标签
        items:
          type: string
        type: array
      createdAt:
        description: 创建时间
        type: string
      firstAppearanceChapterId:
        description: 首次出现章节 ID
        type: integer
      gender:
        description: 角色性别
        type: string
      id:
        description: 角色 ID
        type: integer
      intro:
        description: 角色介绍
        type: string
      motivation:
        description: 角色动机
        type: string
      name:
        description: 角色名称
        type: string
      novelId:
        description: 小说 ID
        type: integer
      personality:
        description: 角色性格
        type: string
      plotDirection:
        description: 角色剧情方向
        type: string
      status:
        description: 角色状态：1 在线，2 下线
        type: integer
      updatedAt:
        description: 更新时间
        type: string
    type: object
  novel.nextChapterNoResponse:
    properties:
      chapterNo:
        type: integer
    type: object
  novel.novelListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/novel.novelResponse'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
